<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs><marker id="aw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#EFEFEF"/></marker></defs>
  <rect width="1600" height="520" fill="#131313"/>
  <rect x="18" y="18" width="1564" height="484" rx="34" fill="none" stroke="#EFEFEF" stroke-width="1.2"/>

  <text x="80" y="88" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#FFC000">progression</text>
  <text x="80" y="126" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" fill="#8C8C8C">The questions changed as the levels became harder.</text>

  <g font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" text-anchor="middle">
    <rect x="90" y="190" width="250" height="110" rx="16" fill="none" stroke="#EFEFEF"/>
    <text x="215" y="232" font-size="20" fill="#EFEFEF">Find the file</text>
    <text x="215" y="264" font-size="15" fill="#8C8C8C">navigation · names · paths</text>

    <line x1="340" y1="245" x2="410" y2="245" stroke="#EFEFEF" marker-end="url(#aw)"/>

    <rect x="425" y="190" width="250" height="110" rx="16" fill="none" stroke="#EFEFEF"/>
    <text x="550" y="232" font-size="20" fill="#EFEFEF">Interpret the data</text>
    <text x="550" y="264" font-size="15" fill="#8C8C8C">filter · decode · extract</text>

    <line x1="675" y1="245" x2="745" y2="245" stroke="#EFEFEF" marker-end="url(#aw)"/>

    <rect x="760" y="190" width="250" height="110" rx="16" fill="none" stroke="#EFEFEF"/>
    <text x="885" y="232" font-size="20" fill="#EFEFEF">Understand identity</text>
    <text x="885" y="264" font-size="15" fill="#8C8C8C">owner · SUID · context</text>

    <line x1="1010" y1="245" x2="1080" y2="245" stroke="#EFEFEF" marker-end="url(#aw)"/>

    <rect x="1095" y="190" width="250" height="110" rx="16" fill="none" stroke="#EFEFEF"/>
    <text x="1220" y="232" font-size="20" fill="#EFEFEF">Analyze behavior</text>
    <text x="1220" y="264" font-size="15" fill="#8C8C8C">cron · shells · services</text>

    <line x1="1345" y1="245" x2="1415" y2="245" stroke="#EFEFEF" marker-end="url(#aw)"/>

    <path d="M1430 190 L1535 190 L1560 215 L1560 275 L1535 300 L1430 300 L1405 275 L1405 215 Z" fill="#4A2A00" stroke="#A55D00"/>
    <text x="1482" y="230" font-size="18" font-weight="700" fill="#EFEFEF">Reason</text>
    <text x="1482" y="260" font-size="15" fill="#FFC000">about the system</text>
  </g>

  <text x="80" y="390" font-family="'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="19" fill="#EFEFEF">The useful shift: from “Which command?” to “Why is this reachable?”</text>
</svg>